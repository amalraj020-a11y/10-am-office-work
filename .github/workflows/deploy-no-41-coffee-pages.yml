name: Deploy No. 41 Coffee to GitHub Pages

# GitHub Pages source: GitHub Actions

on: workflow_dispatch

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-no-41-coffee
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ false }} # Replaced by deploy-websites-pages.yml; retain historical definition.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: sites/no-41-coffee

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
