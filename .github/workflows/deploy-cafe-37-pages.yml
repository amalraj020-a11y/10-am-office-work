name: Deploy latest website to GitHub Pages

on: workflow_dispatch

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-latest
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ false }} # Replaced by deploy-websites-pages.yml; retain historical definition.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload latest website
        uses: actions/upload-pages-artifact@v3
        with:
          path: websites/sikkim-momo-gr-cafe
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
