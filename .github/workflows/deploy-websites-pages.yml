name: Deploy all business previews
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'websites/**'
      - 'sites/**'
      - 'work/screenshots/**'
      - 'cloud/prepare_pages.py'
      - '.github/workflows/deploy-websites-pages.yml'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages-all-businesses
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - run: python3 cloud/prepare_pages.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _pages
      - id: deployment
        uses: actions/deploy-pages@v4
