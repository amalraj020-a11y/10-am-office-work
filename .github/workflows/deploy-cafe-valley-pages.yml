name: Deploy Cafe Valley Coffee Shoppe to GitHub Pages

on: workflow_dispatch

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-cafe-valley
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ false }} # Replaced by deploy-websites-pages.yml; retain historical definition.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Cafe Valley website
        uses: actions/upload-pages-artifact@v3
        with:
          path: sites/cafe-valley-coffee-shoppe

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
